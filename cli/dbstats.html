<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>DB Stats</title>
    <link rel='stylesheet' href='main.css'>
</head>
<body>
    <table><%for(const dbcn of DB.Conns()){ %>
        <tr><td>
            <h4>{@dbcn@}</h4>
            <table><snk:db:stats conn="{@dbcn@}"><%
                for (const [stat,info] of Object.entries(dbstats)){
                   %><tr><th>{@stat@}</th><td>{@info@}</td></tr><%
                }
                %></snk:db:stats></table>
        </td></tr>
        <%}%></table>
</body>
</html>
